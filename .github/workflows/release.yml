name: Release

# 只在手动触发时打包，普通提交和 push 不会触发
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不用带 v，例如 1.0.8）'
        type: string
        required: true
      platform:
        description: '打包平台'
        type: choice
        options:
          - all
          - macos
          - windows
        default: all
      publish:
        description: '打包完成后创建 GitHub Release（关闭则只上传构建产物用于测试）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # 只在这里定一次版本号，两个平台用同一个版本打包，产物才能对得上同一个标签
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 写入版本号
        id: set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式不对，应为 x.y.z，例如 1.0.8"
            exit 1
          fi
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "
          echo 'version='"$VERSION" >> "$GITHUB_OUTPUT"

      # 产物名里带版本号，必须把写好版本的文件带到各平台，不能各算各的
      - uses: actions/upload-artifact@v4
        with:
          name: package-json
          path: package.json

  build-macos:
    needs: prepare
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: 取回指定版本的 package.json
        uses: actions/download-artifact@v4
        with:
          name: package-json
          path: .
          overwrite: true

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建前端
        run: bun run build:web

      - name: 清理上次打包残留
        run: rm -rf release

      - name: 导入代码签名证书
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: 打包 Electron 并签名、公证（不在这里发布）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/run-electron-builder.cjs --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  build-windows:
    needs: prepare
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: 取回指定版本的 package.json
        uses: actions/download-artifact@v4
        with:
          name: package-json
          path: .
          overwrite: true

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建前端
        run: bun run build:web

      - name: 打包 Electron（不在这里发布）
        run: node scripts/run-electron-builder.cjs --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/*.7z
            release/latest*.yml

  publish:
    needs: [prepare, build-macos, build-windows]
    if: always() && !cancelled() && inputs.publish && needs.build-macos.result != 'failure' && needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Release 是否已存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，请换一个版本号重新触发"
            exit 1
          fi

      # 只拉两个平台的安装包，prepare 上传的 package.json 不能混进 Release
      - uses: actions/download-artifact@v4
        with:
          pattern: '{macos,windows}'
          path: release
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
