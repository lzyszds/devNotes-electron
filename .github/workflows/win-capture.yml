name: Windows capture helper

# 只验证截图助手本身（编译、选区单测、无桌面自检）。
# 与发版解耦：改这个 helper 不会触发打包 / Release。
#
# 故意不挂 push 触发：免费额度按分钟计，改一行 helper 就自动跑一次太费。
# 需要时手动 Run workflow，或只推 native/win-capture 相关的改动再说。
on:
  workflow_dispatch:

jobs:
  build-and-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 + 选区单测
        run: node scripts/build-win-capture.cjs

      - name: 无桌面自检（抓屏 → PNG）
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'capture-selftest.png'
          # WIN32 子系统程序不捕获输出时，出错提示全进黑洞，只能看到“没生成 PNG”
          # 用 Start-Process 才能拿到真实退出码：在 pwsh 7 里 & 直接调 GUI 程序，
          # 即使它自己 ExitProcess(1)，$LASTEXITCODE 也可能为空。
          $exe = Resolve-Path "native/win-capture/build/Release/devnotes-capture.exe"
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest', "'$out'" -Wait -PassThru `
            -RedirectStandardError $log
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if ($proc.ExitCode -ne 0) { throw "截图助手自检失败，退出码 $($proc.ExitCode)" }
          if (-not (Test-Path $out)) { throw '截图助手自检未生成 PNG' }
          $bytes = [IO.File]::ReadAllBytes($out)
          if ($bytes[0] -ne 0x89 -or $bytes[1] -ne 0x50) { throw '截图助手输出不是 PNG' }
          Write-Host "selftest PNG: $($bytes.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: devnotes-capture-selftest
          path: ${{ runner.temp }}/capture-selftest.png
